services:
  curiousity:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CURIOUSITY_PORT:-${CLIPFORGE_PORT:-5173}}:5173"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PREMIUM_DAILY_JOBS: ${PREMIUM_DAILY_JOBS:-10}
      MAX_SOURCE_MINUTES: ${MAX_SOURCE_MINUTES:-180}
      MAX_SOURCE_MB: ${MAX_SOURCE_MB:-2048}
      REPLAY_WAIT_MINUTES: ${REPLAY_WAIT_MINUTES:-360}
      REPLAY_CHECK_SECONDS: ${REPLAY_CHECK_SECONDS:-60}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      EXA_API_KEY: ${EXA_API_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      CAPTION_TASK_MINUTES: ${CAPTION_TASK_MINUTES:-240}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - workspace:/data
volumes:
  workspace:
