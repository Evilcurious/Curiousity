services:
  clipforge:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIPFORGE_PORT:-5173}:5173"
    environment:
      AUTH_USER: ${AUTH_USER:-clipforge}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env before starting Clipforge}
      MAX_SOURCE_MINUTES: ${MAX_SOURCE_MINUTES:-180}
      MAX_SOURCE_MB: ${MAX_SOURCE_MB:-2048}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - workspace:/data
volumes:
  workspace:
