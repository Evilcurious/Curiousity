# Curiousity reverse proxy — TLS-ready Nginx configuration.
# For production, uncomment the HTTPS server block and place certificates
# at /etc/letsencrypt/live/<domain>/ (see docs/DEPLOYMENT.md).

upstream curiousity_frontend { server frontend:3000; }
upstream curiousity_backend  { server backend:8000; }

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when certificates are configured:
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    # Security headers (also set by the backend; Nginx enforces them at the edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://curiousity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;            # required for SSE streaming
        proxy_cache off;
        proxy_read_timeout 600s;        # long AI generations
        proxy_send_timeout 600s;
    }

    location /docs {
        proxy_pass http://curiousity_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://curiousity_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}

