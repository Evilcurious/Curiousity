# Include at HTTPS server scope, alongside location / (not inside it).
# Uses the same auth/origin headers and private backend as other API requests.
location = /api/captions/upload {
    include /etc/nginx/snippets/curiousity-proxy.conf;
    client_max_body_size 0;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_send_timeout 125s;
}
